<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- CABEÇALHO -->
        <header class="header">
            <h1>Gerador de senhas</h1>

            <p>
                Gere instantaneamente uma senha aleatória e segura
            </p>

            <div class="lock">🔒</div>
        </header>


        <!-- SENHA -->
        <section class="display-box">

            <div class="password-area">
                <span class="password-label">Senha:</span>

                <span class="password">
                    AgHmANJhyFda
                </span>
            </div>

            <button class="copy-btn">
                Copiar
            </button>

        </section>


        <!-- PERSONALIZAÇÃO -->
        <section class="custom-section">

            <h2>Personalize sua senha</h2>

            <div class="custom-content">

                <!-- NÚMERO DE CARACTERES -->
                <div class="control-group">

                    <span class="control-label">
                        Número de caracteres
                    </span>

                    <div class="counter">

                        <button>-</button>

                        <span>12</span>

                        <button>+</button>

                    </div>

                </div>


                <!-- CARACTERÍSTICAS -->
                <div class="characteristics">

                    <span class="control-label">
                        Características da senha
                    </span>

                    <label>
                        <input type="checkbox" checked>
                        Letras maiúsculas
                    </label>

                    <label>
                        <input type="checkbox" checked>
                        Letras minúsculas
                    </label>

                    <label>
                        <input type="checkbox">
                        Números
                    </label>

                    <label>
                        <input type="checkbox">
                        Símbolos
                    </label>

                </div>

            </div>


            <!-- BOTÃO GERAR -->
            <button class="generate-btn">
                Gerar nova senha
            </button>

        </section>


        <!-- FORÇA DA SENHA -->
        <aside class="strength-panel">

            <h2>Força da senha</h2>


            <div class="strength-item">

                <div class="strength-bar strong"></div>

                <div class="strength-labels">
                    <span>Fraca</span>
                    <span>Forte</span>
                </div>

            </div>


            <div class="strength-item">

                <div class="strength-bar medium"></div>

                <div class="strength-labels">
                    <span>Fraca</span>
                    <span>Forte</span>
                </div>

            </div>


            <div class="strength-item">

                <div class="strength-bar weak"></div>

                <div class="strength-labels">
                    <span>Fraca</span>
                    <span>Forte</span>
                </div>

            </div>


            <h2 class="your-password">
                Sua senha
            </h2>


            <div class="strength-item">

                <div class="strength-bar strong"></div>

                <div class="strength-labels">
                    <span>Fraca</span>
                    <span>Forte</span>
                </div>

            </div>

        </aside>

    </main>

    
</body>

</html>
