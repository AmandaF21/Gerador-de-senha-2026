<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Gerador de senhas</h1>
            <p>Gere instantaneamente uma senha aleatória e segura</p>
            <div class="lock">🔒</div>
        </header>


        <!-- SENHA -->
        <section class="display-box">

            <div class="password-area">
                <span class="password-label">Senha:</span>
                <span id="password">AgHmANJhyFda</span>
            </div>

            <button class="copy-btn" id="copyBtn">
                Copiar
            </button>

        </section>


        <!-- PERSONALIZAÇÃO -->
        <section class="custom-section">

            <h2>Personalize sua senha</h2>

            <div class="custom-content">

                <!-- TAMANHO -->
                <div class="control-group">

                    <span class="control-label">
                        Número de caracteres
                    </span>

                    <div class="counter">

                        <button id="decrement">−</button>

                        <span id="lengthVal">12</span>

                        <button id="increment">+</button>

                    </div>

                </div>


                <!-- CARACTERÍSTICAS -->
                <div class="characteristics">

                    <span class="control-label">
                        Características da senha
                    </span>

                    <label>
                        <input type="checkbox" id="uppercase" checked>
                        Letras maiúsculas
                    </label>

                    <label>
                        <input type="checkbox" id="lowercase" checked>
                        Letras minúsculas
                    </label>

                    <label>
                        <input type="checkbox" id="numbers">
                        Números
                    </label>

                    <label>
                        <input type="checkbox" id="symbols">
                        Símbolos
                    </label>

                </div>

            </div>


            <button class="generate-btn" id="generateBtn">
                Gerar nova senha
            </button>

        </section>


        <!-- FORÇA DA SENHA -->
        <aside class="strength-panel">

            <h2>Força da senha</h2>

            <div class="strength-item">
                <div class="strength-bar strong"></div>

                <div class="strength-labels">
                    <span>Fraca</span>
                    <span>Forte</span>
                </div>
            </div>

            <div class="strength-item">
                <div class="strength-bar medium"></div>

                <div class="strength-labels">
                    <span>Fraca</span>
                    <span>Forte</span>
                </div>
            </div>

            <div class="strength-item">
                <div class="strength-bar weak"></div>

                <div class="strength-labels">
                    <span>Fraca</span>
                    <span>Forte</span>
                </div>
            </div>


            <h2 class="your-password">
                Sua senha
            </h2>

            <div class="strength-item">

                <div id="passwordStrength" class="strength-bar medium"></div>

                <div class="strength-labels">
                    <span>Fraca</span>
                    <span>Forte</span>
                </div>

            </div>

        </aside>

    </main>


    <!-- JAVASCRIPT DENTRO DO HTML -->
    <script>

        const password = document.getElementById("password");

        const copyBtn = document.getElementById("copyBtn");

        const decrement = document.getElementById("decrement");

        const increment = document.getElementById("increment");

        const lengthVal = document.getElementById("lengthVal");

        const generateBtn = document.getElementById("generateBtn");

        const uppercase = document.getElementById("uppercase");

        const lowercase = document.getElementById("lowercase");

        const numbers = document.getElementById("numbers");

        const symbols = document.getElementById("symbols");

        const passwordStrength =
            document.getElementById("passwordStrength");


        let length = 12;


        // DIMINUIR TAMANHO

        decrement.addEventListener("click", function () {

            if (length > 4) {

                length--;

                lengthVal.textContent = length;

            }

        });


        // AUMENTAR TAMANHO

        increment.addEventListener("click", function () {

            if (length < 30) {

                length++;

                lengthVal.textContent = length;

            }

        });


        // GERAR SENHA

        function generatePassword() {

            let characters = "";

            let newPassword = "";


            if (uppercase.checked) {
                characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            }

            if (lowercase.checked) {
                characters += "abcdefghijklmnopqrstuvwxyz";
            }

            if (numbers.checked) {
                characters += "0123456789";
            }

            if (symbols.checked) {
                characters += "!@#$%&*?";
            }


            if (characters === "") {

                alert("Selecione pelo menos uma característica.");

                return;
            }


            for (let i = 0; i < length; i++) {

                const random =
                    Math.floor(Math.random() * characters.length);

                newPassword += characters[random];

            }


            password.textContent = newPassword;

            updateStrength();

        }


        // BOTÃO GERAR

        generateBtn.addEventListener("click", generatePassword);


        // COPIAR SENHA

        copyBtn.addEventListener("click", function () {

            navigator.clipboard.writeText(password.textContent);

            copyBtn.textContent = "Copiado!";

            setTimeout(function () {

                copyBtn.textContent = "Copiar";

            }, 1500);

        });


        // FORÇA DA SENHA

        function updateStrength() {

            let points = 0;


            if (uppercase.checked) {
                points++;
            }

            if (lowercase.checked) {
                points++;
            }

            if (numbers.checked) {
                points++;
            }

            if (symbols.checked) {
                points++;
            }

            if (length >= 12) {
                points++;
            }

            if (length >= 18) {
                points++;
            }


            passwordStrength.classList.remove(
                "weak",
                "medium",
                "strong"
            );


            if (points <= 2) {

                passwordStrength.classList.add("weak");

            } else if (points <= 4) {

                passwordStrength.classList.add("medium");

            } else {

                passwordStrength.classList.add("strong");

            }

        }


        // ATUALIZAR FORÇA QUANDO MARCAR/DESMARCAR

        uppercase.addEventListener("change", updateStrength);

        lowercase.addEventListener("change", updateStrength);

        numbers.addEventListener("change", updateStrength);

        symbols.addEventListener("change", updateStrength);

    </script>

</body>
</html>
